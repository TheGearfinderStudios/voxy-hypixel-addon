plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

// Run full project build when Gradle is invoked without explicit tasks
defaultTasks 'build'

// --- VOXY DEPENDENCY RESOLVER & VERSION CONFIG ---
// Agents/Contributors: Update TARGET_VOXY_VERSION when bumping Voxy dependency version.
def TARGET_VOXY_VERSION = "0.2.18"
def voxyVersionSuffix = TARGET_VOXY_VERSION.substring(TARGET_VOXY_VERSION.lastIndexOf('.') + 1)

// --- DH DEPENDENCY RESOLVER ---
// Drop a distant-horizons-*.jar into /libs to enable DH compile support.
// Build succeeds without it (DH is an optional backend).
def dhJars = fileTree(dir: 'libs', include: "distant-horizons-*.jar").files.sort()
def dhJarFile = dhJars.isEmpty() ? null : dhJars.last()
if (dhJarFile != null) {
    logger.lifecycle("DH: Found jar for compilation: ${dhJarFile.name}")
} else {
    logger.lifecycle("DH: No distant-horizons-*.jar in /libs - DH backend will compile without DH stubs (reflection-only).")
}
// --------------------------------

version = "${project.mod_version}+mc${project.minecraft_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    exclusiveContent {
        forRepository {
            maven { url "https://api.modrinth.com/maven" }
        }
        filter { includeGroup "maven.modrinth" }
    }
    exclusiveContent {
        forRepository {
            maven { url "https://maven.azureaaron.net/releases" }
        }
        filter { includeGroup "net.azureaaron" }
    }
    maven { url = "https://maven.shedaniel.me/" }
    maven { url = "https://maven.terraformersmc.com/releases/" }
    flatDir { dir 'libs' }
}

def voxyJars = fileTree(dir: 'libs', include: "voxy-${TARGET_VOXY_VERSION}*.jar").files.sort()
if (voxyJars.isEmpty()) {
    throw new GradleException("VOXY ERROR: No voxy-${TARGET_VOXY_VERSION}*.jar found in /libs. Please add the JAR to the libs folder.")
}
if (voxyJars.size() > 1) {
    logger.warn("VOXY WARNING: Multiple voxy jars found. Using: ${voxyJars.last().name}")
}
def voxyJarFile = voxyJars.last()
// --------------------------------

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    //mappings loom.officialMojangMappings() // DO NOT uncomment - removed permanently at MC 26.2 (ships with native Mojmap names, no intermediary layer exists)
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // HM-API
    include(implementation("net.azureaaron:hm-api:${project.hm_api_version}"))

    // Voxy - Local for compilation
    compileOnly files(voxyJarFile)

    // DH - Optional local for compilation (reflection-only backend if absent)
    if (dhJarFile != null) {
        compileOnly files(dhJarFile)
    }
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}